services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecobite
      POSTGRES_PASSWORD: ecobite
      POSTGRES_DB: ecobite
    ports:
      - "5432:5432"
    volumes:
      - ecobite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecobite -d ecobite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ecobite-pgdata:
