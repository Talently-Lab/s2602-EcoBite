  /restaurant-requests:
    post:
      tags:
        - restaurant-requests
      summary: Enviar una solicitud de restaurante aliado
      description: |
        Requiere el JWT de una cuenta activa con rol `CLIENTE`. El rol se
        verifica en la base de datos en cada solicitud, nunca desde el token;
        otros roles responden `403`. El solicitante se toma del token, nunca
        del cuerpo.

        - `commitmentAccepted` debe ser `true`: la aceptación del compromiso de
          buenas prácticas queda registrada con la fecha del servidor.
        - La `zoneId` debe existir y estar activa.
        - Solo una solicitud `PENDIENTE` o `APROBADA` por usuario. Una solicitud
          `RECHAZADA` no bloquea: el usuario puede volver a aplicar con otro
          `email`.
        - El `email` debe ser único entre las solicitudes y los restaurantes
          dados de alta; al aprobarse, el restaurante usa esa misma dirección.
        - Las solicitudes del mismo usuario se serializan en la base (advisory
          lock de transacción PostgreSQL), así que un envío concurrente no
          genera solicitudes duplicadas.
      operationId: createRestaurantRequest
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantRequestCreate'
            example:
              name: Verde Bistró
              category: COMIDA_SALUDABLE
              zoneId: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
              address: Av. Santa Fe 1234
              email: contacto@verdebistro.test
              commitmentAccepted: true
      responses:
        '201':
          description: Solicitud creada con `status` = `PENDIENTE`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantRequestEnvelope'
              example:
                request:
                  id: 4f8c2b7a-9d1e-4f6a-b3c5-8e2a1d4f6b7c
                  status: PENDIENTE
                  restaurant:
                    name: Verde Bistró
                    address: Av. Santa Fe 1234
                    email: contacto@verdebistro.test
                    category: Comida saludable
                  zone:
                    id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
                    name: Palermo
                  commitmentAcceptedAt: '2026-02-10T15:30:00.000Z'
                  submittedAt: '2026-02-10T15:30:00.000Z'
                  reviewedAt: null
        '400':
          description: Datos inválidos o zona inexistente/inactiva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                camposAdicionales:
                  summary: Campo no permitido (incluye `status` o `usuarioId`)
                  value:
                    error: Solo se permiten los campos name, category, zoneId, address, email y commitmentAccepted.
                nombreInvalido:
                  summary: Nombre vacío, con controles o mayor a 120 caracteres
                  value:
                    error: El nombre del restaurante es obligatorio y debe tener como máximo 120 caracteres.
                categoriaInvalida:
                  summary: category fuera del enum
                  value:
                    error: 'category debe ser una de: COMIDA_SALUDABLE, COMIDA_DE_ESTACION, COMIDA_VEGANA, COMIDA_CASERA.'
                zonaInvalida:
                  summary: zoneId no es un UUID
                  value:
                    error: zoneId debe ser un UUID válido.
                direccionInvalida:
                  summary: Dirección vacía, con controles o mayor a 200 caracteres
                  value:
                    error: La dirección del restaurante es obligatoria y debe tener como máximo 200 caracteres.
                emailInvalido:
                  summary: Email mal formado
                  value:
                    error: El email del restaurante debe ser válido.
                compromisoNoAceptado:
                  summary: commitmentAccepted ausente o distinto de `true`
                  value:
                    error: Debés aceptar el compromiso de buenas prácticas para enviar la solicitud.
                zonaNoDisponible:
                  summary: Zona inexistente o inactiva
                  value:
                    error: La zona seleccionada no está disponible.
        '401':
          description: Token ausente, inválido o vencido, o cuenta eliminada/inactiva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenAusente:
                  summary: 'Sin encabezado `Authorization: Bearer`'
                  value:
                    error: Se requiere un token Bearer.
                sesionInvalida:
                  summary: Token inválido, vencido o cuenta inactiva
                  value:
                    error: Sesión inválida o vencida.
        '403':
          description: La cuenta no tiene rol `CLIENTE`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No tenés permisos para acceder a este recurso.
        '409':
          description: Conflicto con una solicitud existente o un email ya registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
