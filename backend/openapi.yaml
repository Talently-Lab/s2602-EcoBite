openapi: 3.1.0

info:
  title: EcoBite API
  version: 1.1.0
  description: |
    API de clientes de **EcoBite**, delivery de comida de restaurantes eco-friendly.
    Los clientes se registran y obtienen un JWT de sesión para consultar su perfil.
    Además pueden ver el menú de un restaurante, listar las zonas de entrega y
    crear pedidos de delivery sustentable.

    ## Autenticación

    `POST /users/login` devuelve un `accessToken` JWT HS256 (duración: 1 hora,
    `expiresIn: 3600`). Enviarlo como `Authorization: Bearer <accessToken>` en los
    endpoints protegidos. Claims: `sub` = UUID del usuario, `iss` = `ecobite-api`,
    `aud` = `ecobite-customer`. El token no contiene email ni datos personales.

    No hay refresh tokens ni endpoint de logout: el cliente debe desechar el token
    al cerrar sesión. Un token robado sigue siendo válido hasta su vencimiento,
    salvo que la cuenta se desactive o se rote el secreto.

    ## Convenciones

    - Todas las respuestas incluyen `Cache-Control: no-store` y
      `X-Content-Type-Options: nosniff`.
    - Los `POST` exigen `Content-Type: application/json`; otro media type responde
      `415`. El cuerpo de las solicitudes está limitado a 16 KiB (`413` si se excede).
    - Los errores usan el formato `{"error": "mensaje"}`, sin stack traces ni datos
      internos. Los mensajes están en español.
    - Registro y login comparten un límite de 20 intentos por IP cada 15 minutos.
      Al agotarse, responden `429` con el encabezado `Retry-After`.
    - No hay paginación en esta versión: las colecciones se devuelven completas.

servers:
  - url: /api
    description: API del mismo servidor que publica esta referencia

tags:
  - name: restaurants
    x-displayName: Restaurantes
    description: Catálogo público de restaurantes eco-friendly.
  - name: zones
    x-displayName: Zonas
    description: Zonas de CABA disponibles como destino de entrega.
  - name: orders
    x-displayName: Pedidos
    description: Pedidos del delivery sustentable del cliente autenticado.
  - name: auth
    x-displayName: Autenticación
    description: Registro e inicio de sesión de clientes.
  - name: users
    x-displayName: Usuarios
    description: Perfil del cliente autenticado.

paths:
  /restaurants:
    get:
      tags:
        - restaurants
      summary: Listar restaurantes activos y eco-friendly
      description: |
        Devuelve un array con únicamente los restaurantes activos y
        eco-friendly, ordenados por nombre e ID. No incluye email ni credenciales
        del restaurante. En una base recién inicializada puede devolver `[]`.
      operationId: listRestaurants
      security: []
      x-badges:
        - name: Público
          position: after
      responses:
        '200':
          description: Lista de restaurantes activos y eco-friendly.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
              example:
                - id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  name: Verde Bistró
                  category: Comida saludable
                  isEco: true
                  zone:
                    id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
                    name: Palermo
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /restaurants/{id}:
    get:
      tags:
        - restaurants
      summary: Obtener el detalle de un restaurante con su menú
      description: |
        Devuelve el restaurante junto con sus productos disponibles,
        ordenados por nombre e ID. No incluye email ni credenciales del restaurante.
        Un `id` que no es UUID, un restaurante inexistente, inactivo o no
        eco-friendly responden el mismo `404`, sin distinguir el motivo.
      operationId: getRestaurant
      security: []
      x-badges:
        - name: Público
          position: after
      parameters:
        - name: id
          in: path
          required: true
          description: UUID del restaurante.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurante activo y eco-friendly con su menú disponible.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetail'
              example:
                id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                name: Verde Bistró
                category: Comida saludable
                isEco: true
                zone:
                  id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
                  name: Palermo
                products:
                  - id: 2f6b0f5a-7a2b-4d4a-9f8e-1c2d3e4f5a6b
                    name: Bowl andino
                    category: Bowls
                    price: 12500.00
                    available: true
        '404':
          description: El restaurante no existe, está inactivo o el `id` no es un UUID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Restaurante no encontrado.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /zones:
    get:
      tags:
        - zones
      summary: Listar zonas activas de CABA
      description: |
        Devuelve las zonas activas habilitadas como destino de entrega,
        ordenadas por nombre e ID. `distanceKm` es la distancia promedio estimada
        desde el Obelisco (Haversine, mínimo 0.5 km) y se usa para calcular el
        impacto de CO₂ del pedido.
      operationId: listZones
      security: []
      x-badges:
        - name: Público
          position: after
      responses:
        '200':
          description: Lista de zonas activas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZoneDetail'
              example:
                - id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
                  name: Palermo
                  comuna: 14
                  distanceKm: 4.78
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders:
    get:
      tags:
        - orders
      summary: Listar los pedidos del cliente autenticado
      description: |
        Devuelve solo los pedidos del usuario del token, del más reciente al
        más antiguo.
        La cuenta se consulta en cada llamada: si fue eliminada o desactivada
        responde `401`.
      operationId: listOrders
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      responses:
        '200':
          description: Pedidos del usuario autenticado, más recientes primero.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              example:
                orders:
                  - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    status: EN_PREPARACION
                    createdAt: '2026-02-10T15:30:00.000Z'
                    restaurant:
                      id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      name: Verde Bistró
                    destinationZone:
                      id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
                      name: Palermo
                    deliveryAddress: Av. Corrientes 1234
                    transportType: BICICLETA
                    total: 36800.00
                    impact:
                      distanceKm: 4.78
                      co2SavedKg: 0.382
                      containersAvoided: 5
                      plasticAvoidedG: 68.00
                    items:
                      - productId: 2f6b0f5a-7a2b-4d4a-9f8e-1c2d3e4f5a6b
                        name: Bowl andino
                        quantity: 2
                        unitPrice: 12500.00
                        subtotal: 25000.00
                        containersAvoided: 2
                        plasticAvoidedG: 37.00
                      - productId: 3a7c1e6b-8b3c-4e5b-af9f-2d3e4f5a6b7c
                        name: Wrap verde
                        quantity: 1
                        unitPrice: 11800.00
                        subtotal: 11800.00
                        containersAvoided: 3
                        plasticAvoidedG: 31.00
        '401':
          description: Token ausente, inválido o vencido, o usuario eliminado/inactivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenAusente:
                  summary: 'Sin encabezado `Authorization: Bearer`'
                  value:
                    error: Se requiere un token Bearer.
                sesionInvalida:
                  summary: Token inválido, vencido o cuenta inactiva
                  value:
                    error: Sesión inválida o vencida.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - orders
      summary: Crear un pedido de delivery sustentable
      description: |
        Cualquier rol puede pedir, siempre que la cuenta siga activa.
        El `usuarioId` se toma del token, nunca del cuerpo.

        El servidor calcula todos los importes e impactos con aritmética decimal;
        cualquier total enviado por el cliente se rechaza como campo adicional
        (`400`). Fórmulas (constantes del DER, `CO2_KG_POR_KM = 0.08`):

        - `total` = Σ `quantity × unitPrice` (precio actual del producto).
        - `impact.distanceKm` = `distancia_promedio_km` de la zona destino.
        - `impact.co2SavedKg` = `distanceKm × 0.08`, redondeado a 3 decimales.
          Palermo (4.78 km) → `0.382` kg.
        - `impact.containersAvoided` = Σ `quantity × envasesPorUnidad` del producto.
        - `impact.plasticAvoidedG` = Σ `quantity × envasesPorUnidad × gramos_plastico_evitados`.

        `producto_nombre` y `precio_unitario` se copian en el detalle como datos
        históricos. El pedido siempre nace con `status` = `EN_PREPARACION`.
        La regla de máximo 8 km por tipo de transporte aún no se aplica.

        Todos los `productId` deben pertenecer al restaurante y estar disponibles.
        La zona destino y el restaurante deben estar activos (y el restaurante,
        eco-friendly). Un producto sin `producto_empaque` configurado no se puede
        pedir porque su impacto ambiental sería incalculable.

        **Confirmación duplicada**: las solicitudes idénticas se serializan en la
        base (advisory lock de transacción PostgreSQL), por lo que un doble clic o
        una repetición concurrente nunca genera dos pedidos. Si el mismo usuario
        repite un pedido con el mismo restaurante, zona, dirección, transporte e
        ítems dentro de los 60 segundos siguientes, la API devuelve el pedido
        existente con `200` en lugar de crear uno nuevo.
      operationId: createOrder
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              restaurantId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              destinationZoneId: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
              deliveryAddress: Av. Corrientes 1234
              transportType: BICICLETA
              items:
                - productId: 2f6b0f5a-7a2b-4d4a-9f8e-1c2d3e4f5a6b
                  quantity: 2
                - productId: 3a7c1e6b-8b3c-4e5b-af9f-2d3e4f5a6b7c
                  quantity: 1
      responses:
        '201':
          description: Pedido creado con `status` = `EN_PREPARACION`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
              examples:
                pedido:
                  $ref: '#/components/examples/Order'
        '200':
          description: |
            Pedido idéntico enviado dentro de los 60 segundos siguientes: se
            devuelve el pedido existente sin crear un duplicado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
              examples:
                pedido:
                  $ref: '#/components/examples/Order'
        '400':
          description: Datos inválidos, zona inactiva o productos no disponibles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                camposAdicionales:
                  summary: Campo no permitido (incluye totales calculados por el cliente)
                  value:
                    error: Solo se permiten los campos restaurantId, destinationZoneId, deliveryAddress, transportType e items.
                identificadoresInvalidos:
                  summary: UUID inválido en restaurantId o destinationZoneId
                  value:
                    error: restaurantId y destinationZoneId deben ser UUID válidos.
                direccionInvalida:
                  summary: Dirección vacía, con controles o mayor a 200 caracteres
                  value:
                    error: La dirección de entrega es obligatoria y debe tener como máximo 200 caracteres.
                transporteInvalido:
                  summary: transportType fuera del enum
                  value:
                    error: transportType debe ser BICICLETA o VEHICULO_ELECTRICO.
                itemsInvalidos:
                  summary: Ítems fuera de rango, repetidos o mal formados
                  value:
                    error: items debe tener entre 1 y 50 productos con productId UUID y quantity entera entre 1 y 99, sin repetidos.
                zonaNoDisponible:
                  summary: Zona destino inexistente o inactiva
                  value:
                    error: La zona de destino no está disponible.
                productosNoDisponibles:
                  summary: Producto de otro restaurante o no disponible
                  value:
                    error: Uno o más productos no están disponibles en este restaurante.
                empaqueNoConfigurado:
                  summary: Producto sin relación producto_empaque (impacto incalculable)
                  value:
                    error: Uno o más productos no tienen empaque configurado.
        '401':
          description: Token ausente, inválido o vencido, o usuario eliminado/inactivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenAusente:
                  summary: 'Sin encabezado `Authorization: Bearer`'
                  value:
                    error: Se requiere un token Bearer.
                sesionInvalida:
                  summary: Token inválido, vencido o cuenta inactiva
                  value:
                    error: Sesión inválida o vencida.
        '404':
          description: El restaurante no existe, está inactivo o no es eco-friendly.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Restaurante no encontrado.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{id}:
    get:
      tags:
        - orders
      summary: Obtener un pedido del cliente autenticado
      description: |
        Solo el dueño del pedido puede leerlo: un `id` que no es UUID, un pedido
        inexistente o un pedido de otro usuario responden el mismo `404`.
      operationId: getOrder
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      parameters:
        - name: id
          in: path
          required: true
          description: UUID del pedido.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedido del usuario autenticado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEnvelope'
              examples:
                pedido:
                  $ref: '#/components/examples/Order'
        '401':
          description: Token ausente, inválido o vencido, o usuario eliminado/inactivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenAusente:
                  summary: 'Sin encabezado `Authorization: Bearer`'
                  value:
                    error: Se requiere un token Bearer.
                sesionInvalida:
                  summary: Token inválido, vencido o cuenta inactiva
                  value:
                    error: Sesión inválida o vencida.
        '404':
          description: El pedido no existe, pertenece a otro usuario o el `id` no es un UUID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Pedido no encontrado.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/register:
    post:
      tags:
        - auth
      summary: Registrar una cuenta de cliente
      description: |
        Crea un usuario con rol `CLIENTE`; no existe registro público de
        administradores. La contraseña se almacena con bcrypt (costo 12) y nunca
        se devuelve.
      operationId: registerUser
      security: []
      x-badges:
        - name: Público
          position: after
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: María Fernández
              email: maria.fernandez@ecobite.test
              password: clave-segura-123
      responses:
        '201':
          description: Cuenta creada. El rol siempre es `CLIENTE`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                user:
                  id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  name: María Fernández
                  email: maria.fernandez@ecobite.test
                  role: CLIENTE
                  createdAt: '2026-02-10T15:30:00.000Z'
        '400':
          description: Datos inválidos, campos adicionales o JSON malformado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                contrasenaCorta:
                  summary: Contraseña menor a 8 caracteres
                  value:
                    error: La contraseña debe tener al menos 8 caracteres.
                nombreInvalido:
                  summary: Nombre vacío o demasiado largo
                  value:
                    error: El nombre es obligatorio y debe tener como máximo 120 caracteres.
                credencialesInvalidas:
                  summary: Email inválido o contraseña mayor a 72 bytes
                  value:
                    error: Email y contraseña válidos son obligatorios (máximo 72 bytes para la contraseña).
                camposAdicionales:
                  summary: Se enviaron campos no permitidos
                  value:
                    error: Solo se permiten los campos name, email y password.
                jsonInvalido:
                  summary: Cuerpo que no es JSON válido
                  value:
                    error: JSON inválido.
        '409':
          description: El email ya está registrado (incluye registros concurrentes).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No se pudo registrar ese email.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/login:
    post:
      tags:
        - auth
      summary: Iniciar sesión y obtener el token de acceso
      description: |
        Verifica las credenciales y devuelve un JWT de sesión junto con el
        perfil del usuario, sin contraseñas ni hashes.

        Email desconocido, contraseña incorrecta y cuenta inactiva responden el
        mismo `401`, sin revelar cuál falló; también se ejecuta trabajo bcrypt para
        emails desconocidos para no filtrar información por tiempo de respuesta.
      operationId: loginUser
      security: []
      x-badges:
        - name: Público
          position: after
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria.fernandez@ecobite.test
              password: clave-segura-123
      responses:
        '200':
          description: Sesión iniciada. `accessToken` es válido por 1 hora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjFkZWI0ZC0zYjdkLTRiYWQtOWJkZC0yYjBkN2IzZGNiNmQiLCJpc3MiOiJlY29iaXRlLWFwaSIsImF1ZCI6ImVjb2JpdGUtY3VzdG9tZXIiLCJpYXQiOjE3NzA3NDY0MDAsImV4cCI6MTc3MDc1MDAwMH0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  name: María Fernández
                  email: maria.fernandez@ecobite.test
                  role: CLIENTE
                  createdAt: '2026-02-10T15:30:00.000Z'
        '400':
          description: Datos faltantes o inválidos, o JSON malformado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                credencialesInvalidas:
                  summary: Email inválido o contraseña ausente o mayor a 72 bytes
                  value:
                    error: Email y contraseña válidos son obligatorios (máximo 72 bytes para la contraseña).
                jsonInvalido:
                  summary: Cuerpo que no es JSON válido
                  value:
                    error: JSON inválido.
        '401':
          description: |
            Credenciales incorrectas o cuenta inactiva. La respuesta es idéntica
            para email desconocido y contraseña incorrecta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email o contraseña incorrectos.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags:
        - users
      summary: Obtener el perfil del cliente autenticado
      description: |
        La cuenta se consulta en cada llamada: si el usuario fue eliminado o
        desactivado, el acceso se invalida de inmediato aunque el token no haya
        vencido.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      responses:
        '200':
          description: Perfil del cliente autenticado, sin contraseñas ni hashes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                user:
                  id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                  name: María Fernández
                  email: maria.fernandez@ecobite.test
                  role: CLIENTE
                  createdAt: '2026-02-10T15:30:00.000Z'
        '401':
          description: Token ausente, inválido o vencido, o usuario eliminado/inactivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenAusente:
                  summary: 'Sin encabezado `Authorization: Bearer`'
                  value:
                    error: Se requiere un token Bearer.
                sesionInvalida:
                  summary: Token inválido, vencido o cuenta inactiva
                  value:
                    error: Sesión inválida o vencida.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso JWT HS256 obtenido en `POST /users/login` (1 hora de
        duración, `iss` = `ecobite-api`, `aud` = `ecobite-customer`).

  examples:
    Order:
      summary: Pedido de delivery sustentable
      value:
        order:
          id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          status: EN_PREPARACION
          createdAt: '2026-02-10T15:30:00.000Z'
          restaurant:
            id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
            name: Verde Bistró
          destinationZone:
            id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
            name: Palermo
          deliveryAddress: Av. Corrientes 1234
          transportType: BICICLETA
          total: 36800.00
          impact:
            distanceKm: 4.78
            co2SavedKg: 0.382
            containersAvoided: 5
            plasticAvoidedG: 68.00
          items:
            - productId: 2f6b0f5a-7a2b-4d4a-9f8e-1c2d3e4f5a6b
              name: Bowl andino
              quantity: 2
              unitPrice: 12500.00
              subtotal: 25000.00
              containersAvoided: 2
              plasticAvoidedG: 37.00
            - productId: 3a7c1e6b-8b3c-4e5b-af9f-2d3e4f5a6b7c
              name: Wrap verde
              quantity: 1
              unitPrice: 11800.00
              subtotal: 11800.00
              containersAvoided: 3
              plasticAvoidedG: 31.00

  headers:
    CacheControl:
      description: Las respuestas de la API no deben almacenarse en caché.
      schema:
        type: string
        enum:
          - no-store
    RetryAfter:
      description: Segundos a esperar antes de reintentar la solicitud.
      schema:
        type: integer
        minimum: 0
      example: 900
    ContentTypeOptions:
      description: Impide que el navegador interprete la respuesta con un tipo de contenido distinto.
      schema:
        type: string
        const: nosniff
    RateLimit:
      description: |
        Solo en registro y login, si la solicitud alcanza el limitador después
        de validar el tipo de contenido y analizar el JSON. Formato draft-8:
        `r` indica los intentos restantes y `t` los segundos hasta el reinicio.
      schema:
        type: string
    RateLimitPolicy:
      description: |
        Solo en registro y login, si la solicitud alcanza el limitador.
        Política draft-8 compartida: `q` = 20 intentos, `w` = 900 segundos
        y `pk` identifica la partición del límite.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      description: Formato único de error; sin stack traces ni datos internos.
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error legible, en español.
      additionalProperties: false

    Zone:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre del barrio (zonas de CABA).
          examples: [Palermo]
      additionalProperties: false

    Restaurant:
      type: object
      required:
        - id
        - name
        - category
        - isEco
        - zone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Verde Bistró]
        category:
          type:
            - string
            - 'null'
          description: Categoría del restaurante; puede ser `null`.
          examples: [Comida saludable]
        isEco:
          type: boolean
          const: true
          description: Siempre `true` en esta API (solo se exponen restaurantes eco-friendly).
        zone:
          $ref: '#/components/schemas/Zone'
      additionalProperties: false

    ZoneDetail:
      type: object
      description: Zona de CABA habilitada como destino de entrega.
      required:
        - id
        - name
        - comuna
        - distanceKm
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre del barrio.
          examples: [Palermo]
        comuna:
          type: integer
          examples: [14]
        distanceKm:
          type: number
          description: Distancia promedio estimada desde el Obelisco (Haversine, mínimo 0.5 km).
          examples: [4.78]
      additionalProperties: false

    Product:
      type: object
      required:
        - id
        - name
        - category
        - price
        - available
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Bowl andino]
        category:
          type: string
          description: Categoría de comida de texto libre.
          examples: [Bowls]
        price:
          type: number
          multipleOf: 0.01
          examples: [12500.00]
        available:
          type: boolean
          enum:
            - true
          description: Siempre `true`; solo se exponen productos disponibles.
      additionalProperties: false

    RestaurantRef:
      type: object
      description: Referencia mínima a un restaurante dentro de un pedido.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre comercial del restaurante.
          examples: [Verde Bistró]
      additionalProperties: false

    RestaurantDetail:
      type: object
      required:
        - id
        - name
        - category
        - isEco
        - zone
        - products
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Verde Bistró]
        category:
          type:
            - string
            - 'null'
          description: Categoría del restaurante; puede ser `null`.
          examples: [Comida saludable]
        isEco:
          type: boolean
          const: true
          description: Siempre `true` en esta API (solo se exponen restaurantes eco-friendly).
        zone:
          $ref: '#/components/schemas/Zone'
        products:
          type: array
          description: Productos disponibles del restaurante, ordenados por nombre e ID.
          items:
            $ref: '#/components/schemas/Product'
      additionalProperties: false

    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      additionalProperties: false

    OrderRequest:
      type: object
      required:
        - restaurantId
        - destinationZoneId
        - deliveryAddress
        - transportType
        - items
      properties:
        restaurantId:
          type: string
          format: uuid
          description: Restaurante activo y eco-friendly del que se pide.
        destinationZoneId:
          type: string
          format: uuid
          description: Zona activa de CABA a la que se entrega.
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: Dirección de entrega; se recorta; sin caracteres de control.
          examples: [Av. Corrientes 1234]
        transportType:
          type: string
          enum:
            - BICICLETA
            - VEHICULO_ELECTRICO
          x-enum-descriptions:
            BICICLETA: Entrega en bicicleta.
            VEHICULO_ELECTRICO: Entrega en vehículo eléctrico.
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Sin `productId` repetidos.
          items:
            $ref: '#/components/schemas/OrderItemRequest'
      additionalProperties: false

    OrderItem:
      type: object
      required:
        - productId
        - name
        - quantity
        - unitPrice
        - subtotal
        - containersAvoided
        - plasticAvoidedG
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          description: Copia histórica del nombre del producto al momento del pedido.
          examples: [Bowl andino]
        quantity:
          type: integer
          examples: [2]
        unitPrice:
          type: number
          multipleOf: 0.01
          description: Copia histórica del precio del producto.
          examples: [12500.00]
        subtotal:
          type: number
          multipleOf: 0.01
          description: '`quantity × unitPrice`.'
          examples: [25000.00]
        containersAvoided:
          type: integer
          description: '`quantity × Σ envases_por_unidad` del producto.'
          examples: [2]
        plasticAvoidedG:
          type: number
          multipleOf: 0.01
          description: '`quantity × Σ (envases_por_unidad × gramos_plastico_evitados)`.'
          examples: [37.00]
      additionalProperties: false

    OrderImpact:
      type: object
      required:
        - distanceKm
        - co2SavedKg
        - containersAvoided
        - plasticAvoidedG
      properties:
        distanceKm:
          type: number
          description: Copia de `distancia_promedio_km` de la zona destino.
          examples: [4.78]
        co2SavedKg:
          type: number
          description: '`distanceKm × 0.08` (CO2_KG_POR_KM del DER), 3 decimales.'
          examples: [0.382]
        containersAvoided:
          type: integer
          description: Σ `containersAvoided` de los ítems.
          examples: [5]
        plasticAvoidedG:
          type: number
          multipleOf: 0.01
          description: Σ `plasticAvoidedG` de los ítems.
          examples: [68.00]
      additionalProperties: false

    Order:
      type: object
      required:
        - id
        - status
        - createdAt
        - restaurant
        - destinationZone
        - deliveryAddress
        - transportType
        - total
        - impact
        - items
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDIENTE
            - COMPLETADO
            - CANCELADO
            - EN_PREPARACION
          x-enum-descriptions:
            PENDIENTE: Pedido pendiente.
            COMPLETADO: Pedido completado.
            CANCELADO: Pedido cancelado.
            EN_PREPARACION: Pedido en preparación; estado inicial de los pedidos nuevos.
          description: Estados posibles del pedido; al crearlo siempre es `EN_PREPARACION`.
        createdAt:
          type: string
          format: date-time
        restaurant:
          $ref: '#/components/schemas/RestaurantRef'
        destinationZone:
          $ref: '#/components/schemas/Zone'
        deliveryAddress:
          type: string
        transportType:
          type: string
          enum:
            - BICICLETA
            - VEHICULO_ELECTRICO
          x-enum-descriptions:
            BICICLETA: Entrega en bicicleta.
            VEHICULO_ELECTRICO: Entrega en vehículo eléctrico.
        total:
          type: number
          multipleOf: 0.01
          description: Σ `quantity × unitPrice`; calculado en el servidor con decimales.
          examples: [36800.00]
        impact:
          $ref: '#/components/schemas/OrderImpact'
        items:
          type: array
          description: Ítems ordenados por nombre de producto e ID, no por el orden enviado.
          items:
            $ref: '#/components/schemas/OrderItem'
      additionalProperties: false

    OrderEnvelope:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/Order'
      additionalProperties: false

    OrderListResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      additionalProperties: false

    PublicUser:
      type: object
      description: Perfil del usuario devuelto en registro, login y sesión; nunca incluye contraseñas ni hashes.
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [María Fernández]
        email:
          type: string
          format: email
          examples: [maria.fernandez@ecobite.test]
        role:
          type: string
          enum:
            - CLIENTE
            - ADMIN_PLATAFORMA
            - RESTAURANTE_ADMIN
          x-enum-descriptions:
            CLIENTE: Cuenta creada mediante el registro público de clientes.
            ADMIN_PLATAFORMA: Rol interno de plataforma; sin endpoints administrativos en esta versión.
            RESTAURANTE_ADMIN: Rol de restaurante; sin endpoints de gestión de restaurantes en esta versión.
          description: Rol del usuario. El registro público siempre crea `CLIENTE`.
        createdAt:
          type: string
          format: date-time
          examples: ['2026-02-10T15:30:00.000Z']
      additionalProperties: false

    UserEnvelope:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
      additionalProperties: false

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: |
            Nombre completo del cliente. Se recorta espacio en blanco al inicio y
            al final; no admite caracteres de control.
          examples: [María Fernández]
        email:
          type: string
          format: email
          maxLength: 254
          description: Se recorta y convierte a minúsculas; debe ser único.
          examples: [maria.fernandez@ecobite.test]
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: |
            Al menos 8 caracteres y máximo **72 bytes UTF-8** (el límite de bytes
            evita el truncamiento silencioso de bcrypt). No se recorta ni modifica.
          examples: [clave-segura-123]

    LoginRequest:
      type: object
      description: Los campos adicionales se ignoran.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se recorta y convierte a minúsculas antes de la verificación.
          examples: [maria.fernandez@ecobite.test]
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Máximo 72 bytes UTF-8.
          examples: [clave-segura-123]

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: |
            JWT HS256 de 1 hora: `sub` = UUID del usuario, `iss` = `ecobite-api`,
            `aud` = `ecobite-customer`. Sin email ni datos personales en el payload.
        tokenType:
          type: string
          enum:
            - Bearer
          examples: [Bearer]
        expiresIn:
          type: integer
          enum:
            - 3600
          description: Duración del token en segundos (1 hora).
          examples: [3600]
        user:
          $ref: '#/components/schemas/PublicUser'
      additionalProperties: false

  responses:
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera el límite de 16 KiB.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: El cuerpo de la solicitud es demasiado grande.

    UnsupportedMediaType:
      description: 'Los `POST` requieren `Content-Type: application/json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Se requiere Content-Type: application/json.'

    RateLimited:
      description: |
        Se superó el límite de 20 intentos por IP cada 15 minutos, compartido
        entre registro y login. Consultar `Retry-After` antes de reintentar.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Demasiados intentos. Intentá nuevamente más tarde.

    ServiceUnavailable:
      description: La base de datos no está disponible temporalmente.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Servicio temporalmente no disponible.

    InternalError:
      description: Error inesperado del servidor, sin mensajes internos.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Error interno del servidor.
