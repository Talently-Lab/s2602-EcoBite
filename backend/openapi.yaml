                error: Sesión inválida o vencida.
        '403':
          description: La cuenta no tiene rol `ADMIN_PLATAFORMA`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No tenés permisos para acceder a este recurso.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/restaurant-requests/{id}/approve:
    post:
      tags:
        - admin
      summary: Aprobar una solicitud pendiente
      description: |
        Requiere el JWT de una cuenta activa con rol `ADMIN_PLATAFORMA`,
        verificado en la base en cada solicitud.

        En una sola transacción: marca la solicitud `APROBADA` con la fecha de
        revisión y el administrador revisor, crea el restaurante (activo y eco)
        con los datos de la solicitud y promueve al solicitante a
        `RESTAURANTE_ADMIN` asignándole el restaurante creado.

        - Si la solicitud ya fue revisada (por ejemplo, dos administradores
          actuando a la vez) responde `409`: la actualización condicional en la
          base garantiza que solo una revisión gana.
        - El solicitante debe seguir activo y con rol `CLIENTE`; si no, responde
          `409` y no se crea nada.
        - El cuerpo debe estar vacío (`{}` o ausente): la acción no acepta
          campos.
      operationId: approveRestaurantRequest
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la solicitud pendiente.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Sin campos; enviar `{}` con `Content-Type: application/json` (sin ese encabezado responde `415`).
      responses:
        '200':
          description: Solicitud aprobada; restaurante creado y solicitante promovido.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRestaurantRequestEnvelope'
        '400':
          description: El cuerpo trajo campos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Esta acción no acepta campos.
        '401':
          description: Token ausente, inválido o vencido, o cuenta eliminada/inactiva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Sesión inválida o vencida.
        '403':
          description: La cuenta no tiene rol `ADMIN_PLATAFORMA`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No tenés permisos para acceder a este recurso.
        '404':
          description: La solicitud no existe o el `id` no es un UUID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Solicitud no encontrada.
        '409':
          description: La solicitud no está pendiente o el alta no es posible.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                yaRevisada:
                  summary: La solicitud ya fue aprobada o rechazada
                  value:
                    error: La solicitud ya fue revisada.
                solicitanteNoHabilitable:
                  summary: El solicitante está inactivo o ya no tiene rol CLIENTE
                  value:
                    error: El solicitante no puede ser habilitado como restaurante.
                emailEnUso:
                  summary: Ya existe un restaurante con ese email
                  value:
                    error: Ya existe un restaurante con ese email.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/restaurant-requests/{id}/reject:
    post:
      tags:
        - admin
      summary: Rechazar una solicitud pendiente
      description: |
        Requiere el JWT de una cuenta activa con rol `ADMIN_PLATAFORMA`,
        verificado en la base en cada solicitud.

        Marca la solicitud `RECHAZADA` con la fecha de revisión y el
        administrador revisor. No crea restaurante ni modifica el rol del
        solicitante, y el rechazo no registra motivo: el cuerpo debe estar
        vacío (`{}` o ausente). El solicitante puede volver a aplicar con otro
        email de restaurante. Si la solicitud ya fue revisada, responde `409`.
      operationId: rejectRestaurantRequest
      security:
        - bearerAuth: []
      x-badges:
        - name: JWT
          position: after
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la solicitud pendiente.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Sin campos; enviar `{}` con `Content-Type: application/json` (sin ese encabezado responde `415`).
      responses:
        '200':
          description: Solicitud rechazada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRestaurantRequestEnvelope'
        '400':
          description: El cuerpo trajo campos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Esta acción no acepta campos.
        '401':
          description: Token ausente, inválido o vencido, o cuenta eliminada/inactiva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Sesión inválida o vencida.
        '403':
          description: La cuenta no tiene rol `ADMIN_PLATAFORMA`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No tenés permisos para acceder a este recurso.
        '404':
          description: La solicitud no existe o el `id` no es un UUID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Solicitud no encontrada.
        '409':
          description: La solicitud ya fue revisada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: La solicitud ya fue revisada.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso JWT HS256 obtenido en `POST /users/login` (1 hora de
        duración, `iss` = `ecobite-api`, `aud` = `ecobite-customer`).

  examples:
    Order:
      summary: Pedido de delivery sustentable
      value:
        order:
          id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          status: EN_PREPARACION
          createdAt: '2026-02-10T15:30:00.000Z'
          restaurant:
            id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
            name: Verde Bistró
          destinationZone:
            id: 5c1e0c8a-2f4d-4e3a-9b1a-7d6f0e9c2b31
            name: Palermo
          deliveryAddress: Av. Corrientes 1234
          transportType: BICICLETA
          total: 36800.00
          impact:
            distanceKm: 4.78
            co2SavedKg: 0.382
            containersAvoided: 5
            plasticAvoidedG: 68.00
          items:
            - productId: 2f6b0f5a-7a2b-4d4a-9f8e-1c2d3e4f5a6b
              name: Bowl andino
              quantity: 2
              unitPrice: 12500.00
              subtotal: 25000.00
              containersAvoided: 2
              plasticAvoidedG: 37.00
            - productId: 3a7c1e6b-8b3c-4e5b-af9f-2d3e4f5a6b7c
              name: Wrap verde
              quantity: 1
              unitPrice: 11800.00
              subtotal: 11800.00
              containersAvoided: 3
              plasticAvoidedG: 31.00

  headers:
    CacheControl:
      description: Las respuestas de la API no deben almacenarse en caché.
      schema:
        type: string
        enum:
          - no-store
    RetryAfter:
      description: Segundos a esperar antes de reintentar la solicitud.
      schema:
        type: integer
        minimum: 0
      example: 900
    ContentTypeOptions:
      description: Impide que el navegador interprete la respuesta con un tipo de contenido distinto.
      schema:
        type: string
        const: nosniff
    RateLimit:
      description: |
        Solo en registro y login, si la solicitud alcanza el limitador después
        de validar el tipo de contenido y analizar el JSON. Formato draft-8:
        `r` indica los intentos restantes y `t` los segundos hasta el reinicio.
      schema:
        type: string
    RateLimitPolicy:
      description: |
        Solo en registro y login, si la solicitud alcanza el limitador.
        Política draft-8 compartida: `q` = 20 intentos, `w` = 900 segundos
        y `pk` identifica la partición del límite.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      description: Formato único de error; sin stack traces ni datos internos.
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error legible, en español.
      additionalProperties: false

    Zone:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre del barrio (zonas de CABA).
          examples: [Palermo]
      additionalProperties: false

    Restaurant:
      type: object
      required:
        - id
        - name
        - category
        - isEco
        - zone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Verde Bistró]
        category:
          type: string
          enum:
            - Comida saludable
            - Comida de estación
            - Comida vegana
            - Comida casera
          description: Categoría del restaurante.
          examples: [Comida saludable]
        isEco:
          type: boolean
          const: true
          description: Siempre `true` en esta API (solo se exponen restaurantes eco-friendly).
        zone:
          $ref: '#/components/schemas/Zone'
      additionalProperties: false

    ZoneDetail:
      type: object
      description: Zona de CABA habilitada como destino de entrega.
      required:
        - id
        - name
        - comuna
        - distanceKm
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre del barrio.
          examples: [Palermo]
        comuna:
          type: integer
          examples: [14]
        distanceKm:
          type: number
          description: Distancia promedio estimada desde el Obelisco (Haversine, mínimo 0.5 km).
          examples: [4.78]
      additionalProperties: false

    Product:
      type: object
      required:
        - id
        - name
        - category
        - price
        - available
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Bowl andino]
        category:
          type: string
          description: Categoría de comida de texto libre.
          examples: [Bowls]
        price:
          type: number
          multipleOf: 0.01
          examples: [12500.00]
        available:
          type: boolean
          enum:
            - true
          description: Siempre `true`; solo se exponen productos disponibles.
      additionalProperties: false

    RestaurantRef:
      type: object
      description: Referencia mínima a un restaurante dentro de un pedido.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre comercial del restaurante.
          examples: [Verde Bistró]
      additionalProperties: false

    RestaurantDetail:
      type: object
      required:
        - id
        - name
        - category
        - isEco
        - zone
        - products
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Verde Bistró]
        category:
          type: string
          enum:
            - Comida saludable
            - Comida de estación
            - Comida vegana
            - Comida casera
          description: Categoría del restaurante.
          examples: [Comida saludable]
        isEco:
          type: boolean
          const: true
          description: Siempre `true` en esta API (solo se exponen restaurantes eco-friendly).
        zone:
          $ref: '#/components/schemas/Zone'
        products:
          type: array
          description: Productos disponibles del restaurante, ordenados por nombre e ID.
          items:
            $ref: '#/components/schemas/Product'
      additionalProperties: false

    OrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      additionalProperties: false

    OrderRequest:
      type: object
      required:
        - restaurantId
        - destinationZoneId
        - deliveryAddress
        - transportType
        - items
      properties:
        restaurantId:
          type: string
          format: uuid
          description: Restaurante activo y eco-friendly del que se pide.
        destinationZoneId:
          type: string
          format: uuid
          description: Zona activa de CABA a la que se entrega.
        deliveryAddress:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: Dirección de entrega; se recorta; sin caracteres de control.
          examples: [Av. Corrientes 1234]
        transportType:
          type: string
          enum:
            - BICICLETA
            - VEHICULO_ELECTRICO
          x-enum-descriptions:
            BICICLETA: Entrega en bicicleta.
            VEHICULO_ELECTRICO: Entrega en vehículo eléctrico.
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Sin `productId` repetidos.
          items:
            $ref: '#/components/schemas/OrderItemRequest'
      additionalProperties: false

    OrderItem:
      type: object
      required:
        - productId
        - name
        - quantity
        - unitPrice
        - subtotal
        - containersAvoided
        - plasticAvoidedG
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          description: Copia histórica del nombre del producto al momento del pedido.
          examples: [Bowl andino]
        quantity:
          type: integer
          examples: [2]
        unitPrice:
          type: number
          multipleOf: 0.01
          description: Copia histórica del precio del producto.
          examples: [12500.00]
        subtotal:
          type: number
          multipleOf: 0.01
          description: '`quantity × unitPrice`.'
          examples: [25000.00]
        containersAvoided:
          type: integer
          description: '`quantity × Σ envases_por_unidad` del producto.'
          examples: [2]
        plasticAvoidedG:
          type: number
          multipleOf: 0.01
          description: '`quantity × Σ (envases_por_unidad × gramos_plastico_evitados)`.'
          examples: [37.00]
      additionalProperties: false

    OrderImpact:
      type: object
      required:
        - distanceKm
        - co2SavedKg
        - containersAvoided
        - plasticAvoidedG
      properties:
        distanceKm:
          type: number
          description: Copia de `distancia_promedio_km` de la zona destino.
          examples: [4.78]
        co2SavedKg:
          type: number
          description: '`distanceKm × 0.08` (CO2_KG_POR_KM del DER), 3 decimales.'
          examples: [0.382]
        containersAvoided:
          type: integer
          description: Σ `containersAvoided` de los ítems.
          examples: [5]
        plasticAvoidedG:
          type: number
          multipleOf: 0.01
          description: Σ `plasticAvoidedG` de los ítems.
          examples: [68.00]
      additionalProperties: false

    Order:
      type: object
      required:
        - id
        - status
        - createdAt
        - restaurant
        - destinationZone
        - deliveryAddress
        - transportType
        - total
        - impact
        - items
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDIENTE
            - COMPLETADO
            - CANCELADO
            - EN_PREPARACION
          x-enum-descriptions:
            PENDIENTE: Pedido pendiente.
            COMPLETADO: Pedido completado.
            CANCELADO: Pedido cancelado.
            EN_PREPARACION: Pedido en preparación; estado inicial de los pedidos nuevos.
          description: Estados posibles del pedido; al crearlo siempre es `EN_PREPARACION`.
        createdAt:
          type: string
          format: date-time
        restaurant:
          $ref: '#/components/schemas/RestaurantRef'
        destinationZone:
          $ref: '#/components/schemas/Zone'
        deliveryAddress:
          type: string
        transportType:
          type: string
          enum:
            - BICICLETA
            - VEHICULO_ELECTRICO
          x-enum-descriptions:
            BICICLETA: Entrega en bicicleta.
            VEHICULO_ELECTRICO: Entrega en vehículo eléctrico.
        total:
          type: number
          multipleOf: 0.01
          description: Σ `quantity × unitPrice`; calculado en el servidor con decimales.
          examples: [36800.00]
        impact:
          $ref: '#/components/schemas/OrderImpact'
        items:
          type: array
          description: Ítems ordenados por nombre de producto e ID, no por el orden enviado.
          items:
            $ref: '#/components/schemas/OrderItem'
      additionalProperties: false

    OrderEnvelope:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/Order'
      additionalProperties: false

    OrderListResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      additionalProperties: false

    PublicUser:
      type: object
      description: Perfil del usuario devuelto en registro, login y sesión; nunca incluye contraseñas ni hashes.
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [María Fernández]
        email:
          type: string
          format: email
          examples: [maria.fernandez@ecobite.test]
        role:
          type: string
          enum:
            - CLIENTE
            - ADMIN_PLATAFORMA
            - RESTAURANTE_ADMIN
          x-enum-descriptions:
            CLIENTE: Cuenta creada mediante el registro público de clientes.
            ADMIN_PLATAFORMA: Rol interno de plataforma; sin endpoints administrativos en esta versión.
            RESTAURANTE_ADMIN: Rol de restaurante; sin endpoints de gestión de restaurantes en esta versión.
          description: Rol del usuario. El registro público siempre crea `CLIENTE`.
        createdAt:
          type: string
          format: date-time
          examples: ['2026-02-10T15:30:00.000Z']
      additionalProperties: false

    UserEnvelope:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
      additionalProperties: false

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: |
            Nombre completo del cliente. Se recorta espacio en blanco al inicio y
            al final; no admite caracteres de control.
          examples: [María Fernández]
        email:
          type: string
          format: email
          maxLength: 254
          description: Se recorta y convierte a minúsculas; debe ser único.
          examples: [maria.fernandez@ecobite.test]
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: |
            Al menos 8 caracteres y máximo **72 bytes UTF-8** (el límite de bytes
            evita el truncamiento silencioso de bcrypt). No se recorta ni modifica.
          examples: [clave-segura-123]

    LoginRequest:
      type: object
      description: Los campos adicionales se ignoran.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se recorta y convierte a minúsculas antes de la verificación.
          examples: [maria.fernandez@ecobite.test]
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Máximo 72 bytes UTF-8.
          examples: [clave-segura-123]

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: |
            JWT HS256 de 1 hora: `sub` = UUID del usuario, `iss` = `ecobite-api`,
            `aud` = `ecobite-customer`. Sin email ni datos personales en el payload.
        tokenType:
          type: string
          enum:
            - Bearer
          examples: [Bearer]
        expiresIn:
          type: integer
          enum:
            - 3600
          description: Duración del token en segundos (1 hora).
          examples: [3600]
        user:
          $ref: '#/components/schemas/PublicUser'
      additionalProperties: false

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false

    DashboardStats:
      type: object
      description: Totales globales calculados solo sobre pedidos en estado COMPLETADO.
      required:
        - totalOrders
        - totalRevenue
        - totalCo2Saved
      properties:
        totalOrders:
          type: integer
          description: Cantidad de pedidos en estado COMPLETADO.
          examples: [2]
        totalRevenue:
          type: number
          description: Suma de los montos totales de los pedidos COMPLETADO.
          examples: [4000.25]
        totalCo2Saved:
          type: number
          description: Suma del CO₂ ahorrado (kg) de los pedidos COMPLETADO.
          examples: [1.582]
      additionalProperties: false

    RestaurantCategory:
      type: object
      description: Categoría admitida para restaurantes aliados; `key` es el valor del enum que acepta `POST /restaurant-requests`.
      required:
        - key
        - label
      properties:
        key:
          type: string
          enum:
            - COMIDA_SALUDABLE
            - COMIDA_DE_ESTACION
            - COMIDA_VEGANA
            - COMIDA_CASERA
        label:
          type: string
          enum:
            - Comida saludable
            - Comida de estación
            - Comida vegana
            - Comida casera
          description: Etiqueta en español para mostrar al usuario.
      additionalProperties: false

    RestaurantCategoryListResponse:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantCategory'
      additionalProperties: false

    RestaurantRequestCreate:
      type: object
      required:
        - name
        - category
        - zoneId
        - address
        - email
        - commitmentAccepted
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: Nombre comercial del restaurante; se recorta; sin caracteres de control.
          examples: [Verde Bistró]
        category:
          type: string
          enum:
            - COMIDA_SALUDABLE
            - COMIDA_DE_ESTACION
            - COMIDA_VEGANA
            - COMIDA_CASERA
          description: Una sola categoría; los valores vigentes los publica `GET /restaurant-categories`.
        zoneId:
          type: string
          format: uuid
          description: Zona activa de CABA donde operará el restaurante.
        address:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000-\u001f\u007f]+$'
          description: Dirección del local; se recorta; sin caracteres de control.
          examples: [Av. Santa Fe 1234]
        email:
          type: string
          format: email
          maxLength: 254
          description: Se recorta y convierte a minúsculas; único entre solicitudes y restaurantes.
          examples: [contacto@verdebistro.test]
        commitmentAccepted:
          type: boolean
          const: true
          description: Aceptación del compromiso de buenas prácticas; obligatoria.
      additionalProperties: false

    RestaurantRequest:
      type: object
      description: Solicitud de alta de un restaurante aliado; nunca incluye credenciales.
      required:
        - id
        - status
        - restaurant
        - zone
        - commitmentAcceptedAt
        - submittedAt
        - reviewedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDIENTE
            - APROBADA
            - RECHAZADA
          x-enum-descriptions:
            PENDIENTE: Esperando revisión del administrador.
            APROBADA: Aprobada; el restaurante ya existe y el solicitante es RESTAURANTE_ADMIN.
            RECHAZADA: Rechazada; el solicitante puede volver a aplicar con otro email.
        restaurant:
          type: object
          required:
            - name
            - address
            - email
            - category
          properties:
            name:
              type: string
              examples: [Verde Bistró]
            address:
              type: string
              examples: [Av. Santa Fe 1234]
            email:
              type: string
              format: email
              examples: [contacto@verdebistro.test]
            category:
              type: string
              enum:
                - Comida saludable
                - Comida de estación
                - Comida vegana
                - Comida casera
              description: Etiqueta en español de la categoría.
          additionalProperties: false
        zone:
          $ref: '#/components/schemas/Zone'
        commitmentAcceptedAt:
          type: string
          format: date-time
          description: Fecha del servidor en la que se registró la aceptación del compromiso.
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Fecha de revisión; `null` mientras siga `PENDIENTE`.
      additionalProperties: false

    AdminRestaurantRequest:
      type: object
      description: Solicitud con los datos del solicitante y del revisor; nunca incluye credenciales.
      required:
        - id
        - status
        - restaurant
        - zone
        - applicant
        - reviewedBy
        - commitmentAcceptedAt
        - submittedAt
        - reviewedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDIENTE
            - APROBADA
            - RECHAZADA
        restaurant:
          type: object
          required:
            - name
            - address
            - email
            - category
          properties:
            name:
              type: string
              examples: [Verde Bistró]
            address:
              type: string
              examples: [Av. Santa Fe 1234]
            email:
              type: string
              format: email
              examples: [contacto@verdebistro.test]
            category:
              type: string
              enum:
                - Comida saludable
                - Comida de estación
                - Comida vegana
                - Comida casera
          additionalProperties: false
        zone:
          $ref: '#/components/schemas/Zone'
        applicant:
          type: object
          required:
            - id
            - name
            - email
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              examples: [María Fernández]
            email:
              type: string
              format: email
              examples: [maria.fernandez@ecobite.test]
          additionalProperties: false
        reviewedBy:
          anyOf:
            - type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  examples: [Admin Plataforma]
              additionalProperties: false
            - type: 'null'
          description: Administrador que revisó la solicitud; `null` mientras siga `PENDIENTE`.
        commitmentAcceptedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      additionalProperties: false

    RestaurantRequestEnvelope:
      type: object
      required:
        - request
      properties:
        request:
          $ref: '#/components/schemas/RestaurantRequest'
      additionalProperties: false

    MyRestaurantRequestEnvelope:
      type: object
      required:
        - request
      properties:
        request:
          anyOf:
            - $ref: '#/components/schemas/RestaurantRequest'
            - type: 'null'
          description: Última solicitud del usuario; `null` si nunca aplicó.
      additionalProperties: false

    AdminRestaurantRequestEnvelope:
      type: object
      required:
        - request
      properties:
        request:
          $ref: '#/components/schemas/AdminRestaurantRequest'
      additionalProperties: false

    AdminRestaurantRequestListResponse:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AdminRestaurantRequest'
      additionalProperties: false

  responses:
    PayloadTooLarge:
      description: El cuerpo de la solicitud supera el límite de 16 KiB.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: El cuerpo de la solicitud es demasiado grande.

    UnsupportedMediaType:
      description: 'Los `POST` requieren `Content-Type: application/json`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Se requiere Content-Type: application/json.'

    RateLimited:
      description: |
        Se superó el límite de 20 intentos por IP cada 15 minutos, compartido
        entre registro y login. Consultar `Retry-After` antes de reintentar.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Demasiados intentos. Intentá nuevamente más tarde.

    ServiceUnavailable:
      description: La base de datos no está disponible temporalmente.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Servicio temporalmente no disponible.

    InternalError:
      description: Error inesperado del servidor, sin mensajes internos.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptions'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Error interno del servidor.
