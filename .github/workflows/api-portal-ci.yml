name: API Portal CI

on:
  push:
    branches: [main]
  # Always report a result on PRs so this can be a required check.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-portal-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: API Portal checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Lint
        run: pnpm --filter api-portal lint

      - name: Typecheck
        run: pnpm --filter api-portal typecheck

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api-portal/.next/cache
          key: ${{ runner.os }}-next-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-node22-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter api-portal build
